services:
  - type: web
    name: votesphere
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: votesphere-db
          property: connectionString

databases:
  - name: votesphere-db
    plan: free
    region: oregon
    databaseName: votesphere
    user: votesphere
